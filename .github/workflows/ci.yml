name: MintSpace CI & Test Environment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.23', '1.24' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Code Formatting & Vetting
        run: |
          go vet ./...

      - name: Execute Test Suite
        run: |
          go test -v -cover ./...

      - name: Compile Static Binary
        run: |
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/mintspace .

  docker-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mintspace:test-build
