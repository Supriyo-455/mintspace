{{ define "content" }}
<div class="auth-card">

  <div class="auth-header">
    <div class="auth-tag mono">PEER ARCHIVE ACCESS</div>
    <h1>Scholar Sign In</h1>
    <p class="auth-sub">Enter your academic or contributor credentials to deposit manuscripts and join peer review.</p>
  </div>

  <form action="/login" method="POST" class="auth-form">

    <div class="form-group">
      <label for="email" class="form-label">Email Identity</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="scholar@institution.edu" required autofocus />
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Secret Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-auth">Authenticate &rarr;</button>
    </div>

  </form>

  <div class="auth-demo-hint">
    <div class="hint-title mono">System Demo Credentials:</div>
    <p><strong>Admin Editor:</strong> <span class="mono">admin@mintspace.io</span> / <span class="mono">admin123</span></p>
  </div>

  <div class="auth-footer">
    <p>Do not hold an active researcher account? <a href="/signup">Register here</a>.</p>
  </div>

</div>
{{ end }}
