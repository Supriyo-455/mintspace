{{ define "content" }}
<div class="auth-card">

  <div class="auth-header">
    <div class="auth-tag mono">CONTRIBUTOR ENROLLMENT</div>
    <h1>Register Researcher Account</h1>
    <p class="auth-sub">Create your scholar profile to publish manuscripts, verify content hashes, and review literature.</p>
  </div>

  <form action="/signup" method="POST" class="auth-form">

    <div class="form-group">
      <label for="name" class="form-label">Full Scholar Name / Institutional Identity</label>
      <input type="text" id="name" name="name" class="form-control" placeholder="Dr. Jane Doe" required autofocus />
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Scholarly Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="jane.doe@university.edu" required />
    </div>

    <div class="form-group">
      <label for="dob" class="form-label">Date of Birth</label>
      <input type="date" id="dob" name="dob" class="form-control" />
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Access Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-auth">Enroll as Scholar &rarr;</button>
    </div>

  </form>

  <div class="auth-footer">
    <p>Already hold an active account? <a href="/login">Sign in</a>.</p>
  </div>

</div>
{{ end }}
